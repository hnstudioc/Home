<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HaNull Studio</title>
<meta name="description" content="HaNull Studio가 만드는 앱과 서비스 — 88폰(전화 앱), AlphaWiz(AI 주식 분석), ScreenEagle(화면 감지 알림).">
<meta name="theme-color" content="#2A2F7A">
<link rel="icon" href="image/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="image/apple-touch-icon.png">
<meta property="og:title" content="HaNull Studio">
<meta property="og:description" content="HaNull Studio가 만드는 앱과 서비스.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/portal.css">
</head>
<body>

<a class="skip-link" href="#products">제품 목록 바로가기</a>

<header class="hero">
  <div class="container">
    <img class="hero-mark" src="image/hanull-mark.png" alt="" width="112" height="112">
    <h1>HaNull <strong>Studio</strong></h1>
    <p class="hero-sub">
      쓰는 사람이 편한 것을 만듭니다.<br>
      아래에서 이용하실 앱이나 서비스를 골라 주세요.
    </p>
    <div class="hero-rule" aria-hidden="true"></div>
  </div>
</header>

<main id="products" class="products">
  <div class="container">

    <div class="products-head">
      <h2>앱 · 서비스</h2>
      <span class="products-count" id="product-count"></span>
    </div>

    <ul class="product-grid" id="product-grid">
      <!-- js/products.js 의 목록을 js/portal.js 가 카드로 그립니다. -->
    </ul>

    <noscript>
      <ul class="product-grid">
        <li><a class="product-card" href="88phone/" style="--accent:#A97E4C">
          <div class="product-top"><div>
            <h3 class="product-name">88폰</h3>
            <p class="product-tagline">큰 사진을 누르면 바로 전화가 걸립니다</p>
          </div></div>
          <div class="product-foot"><span class="product-audience">안드로이드 · 무료</span>
          <span class="product-go">바로가기</span></div>
        </a></li>
        <li><a class="product-card" href="alphawiz/" style="--accent:#6B5BFF">
          <div class="product-top"><div>
            <h3 class="product-name">AlphaWiz</h3>
            <p class="product-tagline">AI 기반 주식 분석 서비스</p>
          </div></div>
          <div class="product-foot"><span class="product-audience">개인투자자 · 웹</span>
          <span class="product-go">바로가기</span></div>
        </a></li>
        <li><a class="product-card" href="screeneagle/" style="--accent:#E5A50A">
          <div class="product-top"><div>
            <h3 class="product-name">ScreenEagle</h3>
            <p class="product-tagline">화면 움직임 감지 알림 유틸리티</p>
          </div></div>
          <div class="product-foot"><span class="product-audience">Windows · 데스크톱</span>
          <span class="product-go">바로가기</span></div>
        </a></li>
      </ul>
    </noscript>

  </div>
</main>

<footer class="footer">
  <div class="container footer-inner">
    <span class="footer-brand">
      <img src="image/hanull-mark.png" alt="" width="26" height="26">
      HaNull Studio
    </span>
    <span>
      문의 <a href="mailto:HNStudio.c@gmail.com">HNStudio.c@gmail.com</a>
      &nbsp;·&nbsp; © <span data-year>2026</span> HaNull Studio
    </span>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/portal.js"></script>
</body>
</html>
