<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="펀더멘탈 분석 카드 목업">
  <defs>
    <linearGradient id="fm-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B5BFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="fm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0B1020" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="344" height="224" rx="16" fill="#FFFFFF" filter="url(#fm-shadow)"/>

  <text x="28" y="40" font-family="'Noto Sans KR', sans-serif" font-size="12" font-weight="700" fill="#6B5BFF">펀더멘탈</text>
  <text x="28" y="62" font-family="'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#0B1020">3년 재무 하이라이트</text>

  <rect x="250" y="28" width="84" height="22" rx="11" fill="#EEF2FF"/>
  <circle cx="262" cy="39" r="3" fill="#6B5BFF"/>
  <text x="270" y="43" font-family="'Noto Sans KR', sans-serif" font-size="11" font-weight="600" fill="#4F46E5">AI 요약</text>

  <!-- bars: revenue / op profit / net income over 3 years -->
  <g transform="translate(28, 92)">
    <!-- y-axis faint line -->
    <line x1="0" y1="100" x2="306" y2="100" stroke="#E6E8F0"/>

    <!-- year 2023 -->
    <rect x="10" y="40" width="16" height="60" rx="4" fill="url(#fm-accent)" opacity="0.5"/>
    <rect x="30" y="55" width="16" height="45" rx="4" fill="url(#fm-accent)" opacity="0.7"/>
    <rect x="50" y="62" width="16" height="38" rx="4" fill="url(#fm-accent)" opacity="0.9"/>
    <text x="38" y="114" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="10" fill="#5A6178">2023</text>

    <!-- year 2024 -->
    <rect x="110" y="30" width="16" height="70" rx="4" fill="url(#fm-accent)" opacity="0.5"/>
    <rect x="130" y="42" width="16" height="58" rx="4" fill="url(#fm-accent)" opacity="0.7"/>
    <rect x="150" y="50" width="16" height="50" rx="4" fill="url(#fm-accent)" opacity="0.9"/>
    <text x="138" y="114" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="10" fill="#5A6178">2024</text>

    <!-- year 2025 -->
    <rect x="210" y="16" width="16" height="84" rx="4" fill="url(#fm-accent)" opacity="0.5"/>
    <rect x="230" y="28" width="16" height="72" rx="4" fill="url(#fm-accent)" opacity="0.7"/>
    <rect x="250" y="36" width="16" height="64" rx="4" fill="url(#fm-accent)" opacity="0.9"/>
    <text x="238" y="114" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="10" fill="#5A6178">2025</text>

    <!-- legend -->
    <circle cx="10" cy="134" r="4" fill="url(#fm-accent)" opacity="0.5"/>
    <text x="22" y="138" font-family="'Noto Sans KR', sans-serif" font-size="10" fill="#5A6178">매출</text>
    <circle cx="70" cy="134" r="4" fill="url(#fm-accent)" opacity="0.7"/>
    <text x="82" y="138" font-family="'Noto Sans KR', sans-serif" font-size="10" fill="#5A6178">영업이익</text>
    <circle cx="150" cy="134" r="4" fill="url(#fm-accent)" opacity="0.9"/>
    <text x="162" y="138" font-family="'Noto Sans KR', sans-serif" font-size="10" fill="#5A6178">순이익</text>
  </g>
</svg>
