<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="320" height="620"
     role="img" aria-label="88Phone 전화 걸기 화면 미리보기: 숫자 버튼이 매우 크게 표시되어 있습니다.">
  <defs>
    <clipPath id="screen2"><rect x="16" y="18" width="288" height="584" rx="26"/></clipPath>
    <filter id="shadow2" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1A1A1A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="4" y="6" width="312" height="608" rx="38" fill="#1A1A1A" filter="url(#shadow2)"/>
  <rect x="16" y="18" width="288" height="584" rx="26" fill="#FBF7F0"/>

  <g clip-path="url(#screen2)">
    <rect x="16" y="18" width="288" height="58" fill="#0B57A4"/>
    <text x="160" y="55" font-family="'Noto Sans KR',Arial,sans-serif" font-size="23" font-weight="800"
          fill="#FFFFFF" text-anchor="middle">전화 걸기</text>

    <!-- 입력된 번호 -->
    <rect x="32" y="92" width="256" height="60" rx="12" fill="#FFFFFF" stroke="#DCD3C6" stroke-width="2.5"/>
    <text x="160" y="133" font-family="'Noto Sans KR',Arial,sans-serif" font-size="30" font-weight="700"
          fill="#1A1A1A" text-anchor="middle" letter-spacing="1">010-1234</text>

    <!-- 숫자 키패드 (매우 큰 버튼) -->
    <g font-family="'Noto Sans KR',Arial,sans-serif" text-anchor="middle">
      <!-- 1행 -->
      <rect x="32" y="168" width="80" height="66" rx="14" fill="#FFFFFF" stroke="#B9AC99" stroke-width="2.5"/>
      <text x="72" y="213" font-size="32" font-weight="800" fill="#1A1A1A">1</text>
      <rect x="120" y="168" width="80" height="66" rx="14" fill="#FFFFFF" stroke="#B9AC99" stroke-width="2.5"/>
      <text x="160" y="213" font-size="32" font-weight="800" fill="#1A1A1A">2</text>
      <rect x="208" y="168" width="80" height="66" rx="14" fill="#FFFFFF" stroke="#B9AC99" stroke-width="2.5"/>
      <text x="248" y="213" font-size="32" font-weight="800" fill="#1A1A1A">3</text>
      <!-- 2행 -->
      <rect x="32" y="242" width="80" height="66" rx="14" fill="#FFFFFF" stroke="#B9AC99" stroke-width="2.5"/>
      <text x="72" y="287" font-size="32" font-weight="800" fill="#1A1A1A">4</text>
      <rect x="120" y="242" width="80" height="66" rx="14" fill="#FFFFFF" stroke="#B9AC99" stroke-width="2.5"/>
      <text x="160" y="287" font-size="32" font-weight="800" fill="#1A1A1A">5</text>
      <rect x="208" y="242" width="80" height="66" rx="14" fill="#FFFFFF" stroke="#B9AC99" stroke-width="2.5"/>
      <text x="248" y="287" font-size="32" font-weight="800" fill="#1A1A1A">6</text>
      <!-- 3행 -->
      <rect x="32" y="316" width="80" height="66" rx="14" fill="#FFFFFF" stroke="#B9AC99" stroke-width="2.5"/>
      <text x="72" y="361" font-size="32" font-weight="800" fill="#1A1A1A">7</text>
      <rect x="120" y="316" width="80" height="66" rx="14" fill="#FFFFFF" stroke="#B9AC99" stroke-width="2.5"/>
      <text x="160" y="361" font-size="32" font-weight="800" fill="#1A1A1A">8</text>
      <rect x="208" y="316" width="80" height="66" rx="14" fill="#FFFFFF" stroke="#B9AC99" stroke-width="2.5"/>
      <text x="248" y="361" font-size="32" font-weight="800" fill="#1A1A1A">9</text>
      <!-- 4행 -->
      <rect x="32" y="390" width="80" height="66" rx="14" fill="#F4EDE2" stroke="#B9AC99" stroke-width="2.5"/>
      <text x="72" y="435" font-size="32" font-weight="800" fill="#4A4A4A">*</text>
      <rect x="120" y="390" width="80" height="66" rx="14" fill="#FFFFFF" stroke="#B9AC99" stroke-width="2.5"/>
      <text x="160" y="435" font-size="32" font-weight="800" fill="#1A1A1A">0</text>
      <rect x="208" y="390" width="80" height="66" rx="14" fill="#F4EDE2" stroke="#B9AC99" stroke-width="2.5"/>
      <text x="248" y="435" font-size="32" font-weight="800" fill="#4A4A4A">#</text>
    </g>

    <!-- 통화 버튼 -->
    <rect x="32" y="472" width="256" height="76" rx="20" fill="#15803D"/>
    <path d="M118 500c0-2.2 1.7-4 4-4h4.5c1.7 0 3.2 1.2 3.6 2.9l1.8 6.3c.5 1.6-.1 3.3-1.5 4.2l-2.3 1.6a22 22 0 0 0 9.4 9.4l1.6-2.3c.9-1.4 2.6-2 4.2-1.5l6.3 1.8c1.7.4 2.9 1.9 2.9 3.6v4.5c0 2.3-1.8 4-4 4-16 0-30.5-14.5-30.5-30.5z"
          fill="#FFFFFF"/>
    <text x="185" y="520" font-family="'Noto Sans KR',Arial,sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">통화</text>
  </g>

  <rect x="136" y="30" width="48" height="6" rx="3" fill="#1A1A1A" fill-opacity="0.25"/>
</svg>
