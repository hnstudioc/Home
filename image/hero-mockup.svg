<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" role="img" aria-label="AlphaWiz 채팅 UI 목업">
  <defs>
    <linearGradient id="hm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3F2FF"/>
      <stop offset="100%" stop-color="#E6FBFB"/>
    </linearGradient>
    <linearGradient id="hm-bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6B5BFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="hm-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B5BFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="hm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0B1020" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- background card -->
  <rect x="0" y="0" width="720" height="460" rx="24" fill="url(#hm-bg)"/>

  <!-- window chrome -->
  <rect x="40" y="30" width="640" height="400" rx="18" fill="#FFFFFF" filter="url(#hm-shadow)"/>
  <rect x="40" y="30" width="640" height="44" rx="18" fill="#FAFBFF"/>
  <rect x="40" y="56" width="640" height="18" fill="#FAFBFF"/>
  <circle cx="60" cy="52" r="5" fill="#EF4444"/>
  <circle cx="78" cy="52" r="5" fill="#F59E0B"/>
  <circle cx="96" cy="52" r="5" fill="#10B981"/>
  <rect x="260" y="44" width="200" height="16" rx="8" fill="#E6E8F0"/>
  <text x="360" y="56" text-anchor="middle" font-family="'Noto Sans KR', sans-serif" font-size="11" fill="#5A6178">app.alphawiz.ai</text>

  <!-- user question bubble (right) -->
  <g>
    <rect x="300" y="96" width="340" height="54" rx="14" fill="url(#hm-bubble)"/>
    <text x="320" y="119" font-family="'Noto Sans KR', sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">삼성전자 최근 실적, 기술적 흐름 같이</text>
    <text x="320" y="138" font-family="'Noto Sans KR', sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">분석해줘.</text>
  </g>

  <!-- AI answer bubble (left) -->
  <g>
    <rect x="80" y="166" width="520" height="212" rx="14" fill="#FAFBFF" stroke="#E6E8F0"/>
    <rect x="80" y="166" width="4" height="212" rx="2" fill="url(#hm-accent)"/>

    <text x="100" y="190" font-family="'Noto Sans KR', sans-serif" font-size="11" font-weight="700" fill="#6B5BFF">AlphaWiz</text>
    <text x="160" y="190" font-family="'Noto Sans KR', sans-serif" font-size="10" fill="#5A6178">· 2026-04-17 기준</text>

    <!-- fundamentals row -->
    <text x="100" y="214" font-family="'Noto Sans KR', sans-serif" font-size="12" font-weight="600" fill="#0B1020">펀더멘탈</text>
    <rect x="100" y="224" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#E6E8F0"/>
    <text x="110" y="240" font-family="'Noto Sans KR', sans-serif" font-size="10" fill="#5A6178">매출 YoY</text>
    <text x="110" y="258" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#10B981">+14.2%</text>

    <rect x="228" y="224" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#E6E8F0"/>
    <text x="238" y="240" font-family="'Noto Sans KR', sans-serif" font-size="10" fill="#5A6178">영업이익률</text>
    <text x="238" y="258" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#0B1020">12.8%</text>

    <rect x="356" y="224" width="120" height="44" rx="8" fill="#FFFFFF" stroke="#E6E8F0"/>
    <text x="366" y="240" font-family="'Noto Sans KR', sans-serif" font-size="10" fill="#5A6178">PER</text>
    <text x="366" y="258" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#0B1020">14.6x</text>

    <!-- technical row -->
    <text x="100" y="294" font-family="'Noto Sans KR', sans-serif" font-size="12" font-weight="600" fill="#0B1020">기술적 흐름</text>

    <!-- mini sparkline -->
    <rect x="100" y="304" width="376" height="56" rx="8" fill="#FFFFFF" stroke="#E6E8F0"/>
    <polyline points="110,350 140,342 170,344 200,332 230,336 260,320 290,324 320,310 350,316 380,300 410,306 440,290 470,296" fill="none" stroke="url(#hm-accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="470" cy="296" r="3" fill="#22D3EE"/>
    <text x="110" y="320" font-family="'Noto Sans KR', sans-serif" font-size="10" fill="#5A6178">60일</text>

    <!-- takeaway -->
    <rect x="100" y="348" width="376" height="0" fill="none"/>
  </g>

  <!-- input bar -->
  <g>
    <rect x="80" y="390" width="560" height="48" rx="24" fill="#FFFFFF" stroke="#E6E8F0"/>
    <text x="104" y="420" font-family="'Noto Sans KR', sans-serif" font-size="13" fill="#9AA0B4">무엇이든 물어보세요 — 종목, 재무, 차트…</text>
    <circle cx="612" cy="414" r="16" fill="url(#hm-accent)"/>
    <path d="M606 414 L618 414 M614 410 L618 414 L614 418" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
