<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-label="기술적 분석 카드 목업">
  <defs>
    <linearGradient id="cm-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B5BFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="cm-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6B5BFF"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="cm-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0B1020" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="344" height="224" rx="16" fill="#FFFFFF" filter="url(#cm-shadow)"/>

  <!-- header -->
  <text x="28" y="40" font-family="'Noto Sans KR', sans-serif" font-size="12" font-weight="700" fill="#6B5BFF">기술적 분석</text>
  <text x="28" y="62" font-family="'Noto Sans KR', sans-serif" font-size="18" font-weight="700" fill="#0B1020">돌파 시도 · 거래량 동반</text>

  <!-- tag -->
  <rect x="250" y="28" width="84" height="22" rx="11" fill="#ECFDF5"/>
  <circle cx="262" cy="39" r="3" fill="#10B981"/>
  <text x="270" y="43" font-family="'Noto Sans KR', sans-serif" font-size="11" font-weight="600" fill="#059669">매수 시그널</text>

  <!-- chart area -->
  <rect x="28" y="78" width="306" height="116" rx="10" fill="#FAFBFF"/>
  <path d="M36 170 L60 158 L84 162 L108 146 L132 150 L156 132 L180 138 L204 118 L228 124 L252 104 L276 110 L300 92 L324 98 L324 186 L36 186 Z" fill="url(#cm-fill)"/>
  <polyline points="36,170 60,158 84,162 108,146 132,150 156,132 180,138 204,118 228,124 252,104 276,110 300,92 324,98" fill="none" stroke="url(#cm-line)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="324" cy="98" r="4" fill="#22D3EE"/>
  <circle cx="324" cy="98" r="8" fill="#22D3EE" fill-opacity="0.25"/>

  <!-- gridline labels -->
  <text x="36" y="204" font-family="'Noto Sans KR', sans-serif" font-size="9" fill="#9AA0B4">3M</text>
  <text x="172" y="204" font-family="'Noto Sans KR', sans-serif" font-size="9" fill="#9AA0B4" text-anchor="middle">1M</text>
  <text x="324" y="204" font-family="'Noto Sans KR', sans-serif" font-size="9" fill="#9AA0B4" text-anchor="end">오늘</text>

  <!-- indicator badges -->
  <rect x="28" y="214" width="70" height="0" fill="none"/>
</svg>
