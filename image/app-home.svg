<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 620" width="320" height="620"
     role="img" aria-label="88Phone 홈 화면 미리보기: 전화, 문자, 사진, 카메라, 가족, 도움 버튼이 큼직하게 배열되어 있습니다.">
  <defs>
    <clipPath id="screen"><rect x="16" y="18" width="288" height="584" rx="26"/></clipPath>
    <filter id="shadow" x="-30%" y="-10%" width="160%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1A1A1A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 단말기 외곽 -->
  <rect x="4" y="6" width="312" height="608" rx="38" fill="#1A1A1A" filter="url(#shadow)"/>
  <rect x="16" y="18" width="288" height="584" rx="26" fill="#FBF7F0"/>

  <g clip-path="url(#screen)">
    <!-- 상태 표시줄: 크고 읽기 쉬운 시계 -->
    <rect x="16" y="18" width="288" height="66" fill="#0B57A4"/>
    <text x="36" y="53" font-family="'Noto Sans KR',Arial,sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">오후 2:30</text>
    <text x="36" y="72" font-family="'Noto Sans KR',Arial,sans-serif" font-size="14" font-weight="500" fill="#BFD8F0">9월 1일 월요일</text>
    <!-- 배터리 -->
    <rect x="248" y="38" width="34" height="17" rx="4" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <rect x="251" y="41" width="22" height="11" rx="2" fill="#FFFFFF"/>
    <rect x="283" y="43" width="3.5" height="7" rx="1.5" fill="#FFFFFF"/>

    <!-- 큰 버튼 6개 -->
    <!-- 1행 -->
    <g>
      <rect x="32" y="102" width="122" height="118" rx="18" fill="#FFFFFF" stroke="#DCD3C6" stroke-width="2.5"/>
      <circle cx="93" cy="146" r="26" fill="#E9F7EE"/>
      <path d="M83 137c0-2 1.5-3.5 3.5-3.5h4c1.5 0 2.8 1 3.2 2.5l1.6 5.6c.4 1.4-.1 2.9-1.3 3.7l-2 1.4a20 20 0 0 0 8.3 8.3l1.4-2c.8-1.2 2.3-1.7 3.7-1.3l5.6 1.6c1.5.4 2.5 1.7 2.5 3.2v4c0 2-1.5 3.5-3.5 3.5C97 164 83 150 83 137z"
            fill="#15803D" transform="translate(-10,-8) scale(1.02)"/>
      <text x="93" y="196" font-family="'Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="800" fill="#1A1A1A" text-anchor="middle">전화</text>
    </g>
    <g>
      <rect x="166" y="102" width="122" height="118" rx="18" fill="#FFFFFF" stroke="#DCD3C6" stroke-width="2.5"/>
      <circle cx="227" cy="146" r="26" fill="#E8F0FA"/>
      <rect x="213" y="136" width="28" height="20" rx="4" fill="#0B57A4"/>
      <path d="M217 158l-3 7 9-7z" fill="#0B57A4"/>
      <text x="227" y="196" font-family="'Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="800" fill="#1A1A1A" text-anchor="middle">문자</text>
    </g>

    <!-- 2행 -->
    <g>
      <rect x="32" y="234" width="122" height="118" rx="18" fill="#FFFFFF" stroke="#DCD3C6" stroke-width="2.5"/>
      <circle cx="93" cy="278" r="26" fill="#FDF0E7"/>
      <rect x="79" y="268" width="28" height="21" rx="3" fill="none" stroke="#C2410C" stroke-width="3"/>
      <circle cx="93" cy="278.5" r="6" fill="#C2410C"/>
      <rect x="87" y="263" width="12" height="6" rx="2" fill="#C2410C"/>
      <text x="93" y="328" font-family="'Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="800" fill="#1A1A1A" text-anchor="middle">사진</text>
    </g>
    <g>
      <rect x="166" y="234" width="122" height="118" rx="18" fill="#FFFFFF" stroke="#DCD3C6" stroke-width="2.5"/>
      <circle cx="227" cy="278" r="26" fill="#FFF4CC"/>
      <path d="M227 264l4.2 8.6 9.5 1.4-6.9 6.7 1.6 9.4-8.4-4.4-8.4 4.4 1.6-9.4-6.9-6.7 9.5-1.4z" fill="#B45309"/>
      <text x="227" y="328" font-family="'Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="800" fill="#1A1A1A" text-anchor="middle">즐겨찾기</text>
    </g>

    <!-- 3행 -->
    <g>
      <rect x="32" y="366" width="122" height="118" rx="18" fill="#FFFFFF" stroke="#DCD3C6" stroke-width="2.5"/>
      <circle cx="93" cy="410" r="26" fill="#F1E9FB"/>
      <circle cx="93" cy="403" r="8" fill="#6B21A8"/>
      <path d="M79 424c0-7.5 6.3-12 14-12s14 4.5 14 12z" fill="#6B21A8"/>
      <text x="93" y="460" font-family="'Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="800" fill="#1A1A1A" text-anchor="middle">가족</text>
    </g>
    <g>
      <rect x="166" y="366" width="122" height="118" rx="18" fill="#FFFFFF" stroke="#DCD3C6" stroke-width="2.5"/>
      <circle cx="227" cy="410" r="26" fill="#E8F0FA"/>
      <text x="227" y="421" font-family="'Noto Sans KR',Arial,sans-serif" font-size="34" font-weight="800" fill="#0B57A4" text-anchor="middle">?</text>
      <text x="227" y="460" font-family="'Noto Sans KR',Arial,sans-serif" font-size="21" font-weight="800" fill="#1A1A1A" text-anchor="middle">도움말</text>
    </g>

    <!-- 하단 긴급 버튼 -->
    <rect x="32" y="500" width="256" height="72" rx="18" fill="#C2410C"/>
    <circle cx="76" cy="536" r="19" fill="#FFFFFF" fill-opacity="0.22"/>
    <path d="M76 525l11 20H65z" fill="#FFFFFF"/>
    <rect x="74.6" y="531" width="2.8" height="8" rx="1.4" fill="#C2410C"/>
    <circle cx="76" cy="542" r="1.6" fill="#C2410C"/>
    <text x="112" y="533" font-family="'Noto Sans KR',Arial,sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">긴급 도움</text>
    <text x="112" y="554" font-family="'Noto Sans KR',Arial,sans-serif" font-size="14" font-weight="500" fill="#FBDDCB">길게 누르면 연결됩니다</text>
  </g>

  <!-- 전면 스피커 -->
  <rect x="136" y="30" width="48" height="6" rx="3" fill="#1A1A1A" fill-opacity="0.25"/>
</svg>
